<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 左：横版图片卡片（山形折线 + 太阳圆点 = "图片"的通用图形语言） -->
  <rect x="7.5" y="17.7" width="14" height="12.6" rx="2.5"/>
  <circle cx="10.7" cy="21.6" r="1.5" fill="currentColor" stroke="none"/>
  <path d="M8.8 28.2 L12.2 24.7 L14.6 26.9 L17.1 24.5 L19.3 28.2"/>
  <!-- 中：单向箭头（合成方向：图片 → PDF） -->
  <path d="M23.9 24 H27.2 M24.9 21.6 L27.2 24 L24.9 26.4"/>
  <!-- 右：竖版 PDF 页面母题（rx=3，约 24:32 比例） -->
  <rect x="29.5" y="16.3" width="11.4" height="15.4" rx="3"/>
</svg>
