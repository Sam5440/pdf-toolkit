<!-- 压平合并：蓝色双层菱形叠板（上层主蓝、下层天蓝示层次），橙色下压箭头（轻弯竖杆 + 宽垂箭头）将多层压成一层 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 下层叠板：天蓝，边微鼓 -->
    <path d="M24 11.3 Q32.7 14.5 39.3 18.7 Q32.7 22.9 24 26 Q15.3 22.9 8.7 18.7 Q15.3 14.5 24 11.3 Z" stroke="#0EA5E9"/>
    <!-- 上层叠板：文档主蓝 -->
    <path d="M24 7.7 Q32.7 10.9 39.3 15.1 Q32.7 19.3 24 22.4 Q15.3 19.3 8.7 15.1 Q15.3 10.9 24 7.7 Z" stroke="#3B82F6"/>
    <!-- 下压箭杆：橙色轻弯竖线 -->
    <path d="M24 26.9 Q25.2 31.9 24 36.7" stroke="#F97316"/>
    <!-- 下压宽箭头：橙色微垂双臂 -->
    <path d="M9.4 30.3 Q16.7 34.9 24 37.4 Q31.3 34.9 38.6 30.3" stroke="#F97316"/>
  </g>
</svg>
