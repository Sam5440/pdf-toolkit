<!-- 扫描：天蓝手绘相机（机身 + 顶盖 + 圆镜头），一道绿色轻弯扫描光线横贯镜头，表达扫描捕捉 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 机身：横版微鼓圆角矩形 -->
    <path d="M9.9 15.3 Q24 14.7 38.1 15.2 Q40.9 15.3 41 18 Q41.4 27 41 35.9 Q40.9 38.6 38.2 38.8 Q24 39.3 9.8 38.9 Q7.1 38.8 7 36.1 Q6.6 27 7 17.9 Q7.1 15.4 9.9 15.3 Z" stroke="#0EA5E9"/>
    <!-- 顶盖：梯形机顶 -->
    <path d="M16.6 15.3 L19.4 10.4 Q19.9 9.7 20.7 9.7 L27.3 9.7 Q28.1 9.7 28.6 10.4 L31.4 15.3" stroke="#0EA5E9"/>
