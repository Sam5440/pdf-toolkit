<!-- 栅格化：蓝色手绘页面被青色轻弯网格线切成像素格子，格内青色小方块与实心像素点，表达矢量转位图的栅格语义 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 页面轮廓：横竖等分的方形页面，四边微鼓 -->
    <path d="M13.6 9.5 Q24 8.9 34.4 9.4 Q36.7 9.5 36.8 11.8 Q37.2 24 36.9 36.2 Q36.8 38.5 34.5 38.6 Q24 39.1 13.5 38.7 Q11.3 38.6 11.2 36.3 Q10.9 24 11.2 11.9 Q11.2 9.7 13.6 9.5 Z" stroke="#3B82F6"/>
    <!-- 像素网格：两竖两横轻弯分割线 -->
    <path d="M20.1 9.7 Q19.6 24 20.1 38.5 M28 9.6 Q28.5 24 27.9 38.6 M11.4 18 Q24 17.5 36.6 18.1 M11.3 26.1 Q24 26.7 36.7 26" stroke="#14B8A6"/>
    <!-- 像素小方块：两格内的青色色块 -->
    <path d="M22.6 11.9 L26.3 11.8 L26.4 15.6 L22.7 15.7 Z" stroke="#14B8A6"/>
    <path d="M14.5 29.7 L18.2 29.6 L18.3 33.4 L14.6 33.5 Z" stroke="#14B8A6"/>
    <!-- 实心像素点：右下格的实心圆点 -->
    <circle cx="32.6" cy="31.8" r="2" fill="#14B8A6" stroke="none"/>
  </g>
</svg>
