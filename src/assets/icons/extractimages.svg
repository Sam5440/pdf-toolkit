<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 源：竖版 PDF 页面母题（rx=3），右下角边线在图片卡片处断开，形成"取出开口" -->
  <path d="M12.5 8.75 H27 A3 3 0 0 1 30 11.75 V27.25 M22 36.25 H12.5 A3 3 0 0 1 9.5 33.25 V11.75 A3 3 0 0 1 12.5 8.75"/>
  <!-- 嵌入图片卡片：正从页面右下角被抽出（与页面部分重叠、正在离开） -->
  <rect x="22" y="27.25" width="17" height="12.5" rx="2.5"/>
  <!-- 卡片内容：山形 + 太阳（图像的经典象形） -->
  <path d="M24.8 36.5 L29.3 31.6 L32.5 35.2"/>
  <circle cx="34.9" cy="31.9" r="1.5" fill="currentColor" stroke="none"/>
  <!-- 提取箭头：从页面内部指向被抽出的图片 -->
  <path d="M15.5 16.75 L24 25.25 M20.8 24.65 L24 25.25 L23.4 22.05"/>
</svg>
