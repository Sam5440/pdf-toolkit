<!-- 家的剪影：天蓝屋顶罩住蓝色墙体，中央圆拱门点暖橙，表达"回到首页" -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 屋顶：山形一笔挑出屋檐，天蓝主笔 -->
    <path d="M8.2 23.8 Q15.4 17.6 22.6 11.2 A2 2 0 0 1 25.2 11.2 Q32.4 17.4 39.6 23.6" stroke="#0EA5E9"/>
    <!-- 屋身：墙体两笔带手绘微弯，蓝色 -->
    <path d="M12.6 26.8 Q12.3 31.6 12.6 36 A3.1 3.1 0 0 0 15.6 39 Q24 39.5 32.4 39 A3.1 3.1 0 0 0 35.4 36 Q35.7 31.4 35.4 26.6" stroke="#3B82F6"/>
    <!-- 圆拱门：暖橙点亮入口 -->
    <path d="M20.4 38.9 Q20.3 34.4 20.5 30.6 A3.6 3.6 0 0 1 27.5 30.6 Q27.7 34.6 27.6 38.9" stroke="#F59E0B"/>
    <!-- 铅笔复描：屋顶脊线旁的平行短笔 -->
    <path d="M18.4 14.6 Q20.9 12.5 23.4 10.7" stroke="#0EA5E9"/>
  </g>
</svg>
