<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 两份平行并排的竖版 PDF 页面（水平对齐成排，区别于 organize 的对角错位） -->
  <rect x="7.5" y="6.5" width="14" height="18.5" rx="3"/>
  <rect x="26.5" y="6.5" width="14" height="18.5" rx="3"/>
  <!-- 左页 2 行内容线 -->
  <path d="M11 12 H18 M11 16.5 H15"/>
  <!-- 右页 3 行内容线：行数不等，暗示两份文档有差异 -->
  <path d="M30 12 H37 M30 16.5 H34 M30 21 H37"/>
  <!-- 下方水平双向对比箭头 ⇄：上箭头向右，下箭头向左（两份文档互相对照） -->
  <path d="M9 31 H39 M35.5 27.5 L39 31 L35.5 34.5"/>
  <path d="M39 38.5 H9 M12.5 35 L9 38.5 L12.5 42"/>
</svg>
