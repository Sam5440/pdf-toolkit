<!-- 手写签名：蓝色竖版手绘页面，紫色一笔手写曲线在页面上挥就签名（起笔上挑、中段回环、末笔收锋），下衬石板灰签名基线与复描短线 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 页面轮廓：文档主蓝 -->
    <path d="M15.2 8.3 Q22.6 7.7 29.9 8.2 L35.8 14.1 Q36.4 25.5 36 36.9 A3.2 3.2 0 0 1 32.9 39.9 Q24 40.5 15.1 39.8 A3.2 3.2 0 0 1 12.1 36.8 Q11.6 24 12.2 11.2 A3.2 3.2 0 0 1 15.2 8.3 Z" stroke="#3B82F6"/>
    <!-- 折角翻页：天蓝点亮 -->
    <path d="M29.9 8.3 Q29.7 10.7 30 12.3 A3 3 0 0 0 33 14.3 Q34.4 14.3 35.8 14.1" stroke="#0EA5E9"/>
    <!-- 签名曲线：紫色连笔，大环套小环 -->
    <path d="M16.2 30.4 C20.8 31 21.8 16.4 25.2 16.6 C27.8 16.8 26.1 28 28.9 27.8 C31.1 27.6 31.1 23 32.9 23.1" stroke="#8B5CF6"/>
