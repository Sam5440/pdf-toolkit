<!-- 票据：蓝色手绘票据页（两侧竖边微鼓），石板灰锯齿撕拉底边，页内琥珀色金额行长短错落，账单语义 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 票据轮廓：顶部与两侧为蓝色，底部开口交予锯齿 -->
    <path d="M12 35.8 Q11.6 21 12 9.4 Q12.1 7.4 14.1 7.3 Q24 6.8 33.9 7.2 Q35.9 7.3 36 9.3 Q36.3 22 36 35.9" stroke="#3B82F6"/>
    <!-- 锯齿底边：石板灰撕拉锯齿 -->
    <path d="M12.1 35.9 L15.1 39.1 L18.1 36 L21.1 39.2 L24.1 36 L27.1 39.1 L30.1 36 L33.1 39.2 L36 36.1" stroke="#64748B"/>
    <!-- 金额行：琥珀色长短三行 -->
    <path d="M17.2 15.4 Q24 14.9 30.8 15.3 M17.2 21 Q22 20.6 26.8 21 M17.2 26.6 Q19.8 26.3 22.4 26.7" stroke="#F59E0B"/>
    <!-- 铅笔复描：左边缘旁平行短线 -->
    <path d="M12.5 29.5 Q12.4 32.3 12.6 35" stroke="#3B82F6"/>
  </g>
</svg>
