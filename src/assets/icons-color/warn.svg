<!-- 警示：琥珀色三角形轮廓（三边轻弯外鼓），橙色感叹号短线加实心圆点居中 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 三角形：三边手绘外鼓 -->
    <path d="M24 8 Q33.6 23.4 41 40 Q24 41 7 40 Q14.4 23.5 24 8 Z" stroke="#F59E0B"/>
    <!-- 感叹号短线 -->
    <path d="M24 17 Q23.6 22.2 24 27.5" stroke="#F97316"/>
    <!-- 感叹号圆点：实心点缀 -->
    <circle cx="24.1" cy="33.6" r="2" fill="#F97316" stroke="none"/>
  </g>
</svg>
