<!-- 文档信息：天蓝竖版手绘页面（右上折角以深蓝点亮），页面上琥珀色实心圆点 + 短横抽象表达"信息"（不用字母），下衬石板灰正文行 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 页面轮廓：天蓝，四边微鼓、圆角手绘闭合 -->
    <path d="M15.2 8.3 Q22.6 7.7 29.9 8.2 L35.8 14.1 Q36.4 25.5 36 36.9 A3.2 3.2 0 0 1 32.9 39.9 Q24 40.5 15.1 39.8 A3.2 3.2 0 0 1 12.1 36.8 Q11.6 24 12.2 11.2 A3.2 3.2 0 0 1 15.2 8.3 Z" stroke="#0EA5E9"/>
    <!-- 折角翻页：深蓝，与天蓝页面区分层次 -->
    <path d="M29.9 8.3 Q29.7 10.7 30 12.3 A3 3 0 0 0 33 14.3 Q34.4 14.3 35.8 14.1" stroke="#3B82F6"/>
    <!-- 信息圆点：琥珀实心点（无描边） -->
    <circle cx="24.4" cy="20.8" r="2.1" fill="#F59E0B" stroke="none"/>
    <!-- 信息短横：与圆点组成抽象"信息"记号 -->
    <path d="M21.9 26.7 Q24.4 26.2 26.9 26.6" stroke="#F59E0B"/>
    <!-- 正文行：石板灰轻弯线 -->
    <path d="M17.2 32.3 Q24 31.8 30.8 32.2" stroke="#64748B"/>
  </g>
</svg>
