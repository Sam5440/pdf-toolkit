    <path d="M15.9 34.8 Q24 34.3 32.1 34.7" stroke="#64748B"/>
    <!-- 基线下平行复描短线：双划线铅笔感 -->
    <path d="M18.3 38 Q21 37.8 23.4 37.9" stroke="#64748B"/>
  </g>
</svg>
