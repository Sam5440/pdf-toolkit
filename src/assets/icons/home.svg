<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 屋顶：山形轮廓，左端留缺口形成屋檐挑出（家的剪影母题） -->
  <path d="M8 23.5 L23 10.5 A1.6 1.6 0 0 1 25 10.5 L40 23.5"/>
  <!-- 屋身：圆角矩形墙体，与屋顶脱开一线制造层次 -->
  <path d="M12.5 26.5 V36 A3 3 0 0 0 15.5 39 H32.5 A3 3 0 0 0 35.5 36 V26.5"/>
  <!-- 门：圆拱门洞，落在墙底边上 -->
  <path d="M20.5 39 V30.5 A3.5 3.5 0 0 1 27.5 30.5 V39"/>
</svg>
