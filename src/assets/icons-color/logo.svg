<!-- 品牌标：蓝色竖版页面右下留缺口，嵌橙色四角闪光作“魔法工具”，右上小实心闪光呼应，构成多点魔法的品牌节奏 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 页面轮廓：四边轻弯、圆角转角，右下缺口留给工具 -->
    <path d="M31 22.5 Q30 17 31.1 11.1 Q31 8 28 8 Q20 7.1 12 8.1 Q9 8.2 9 11 Q8 22 9.1 33 Q9 36 12 36 Q18 37 24.5 36" stroke="#3B82F6"/>
    <!-- 页面内容线两条：中性灰次级细节 -->
    <path d="M14 15 Q19.8 14.2 25.5 15.2 M14 20.5 Q17.8 19.7 21.5 20.7" stroke="#64748B"/>
    <!-- 主闪光：四角星嵌于缺口，橙色动作能量 -->
    <path d="M33 25.4 Q34.1 32 40.6 33 Q34 34.1 33 40.6 Q31.9 34 25.4 33 Q32 31.9 33 25.4 Z" stroke="#F97316"/>
    <!-- 右上小闪光：实心点缀 -->
    <path d="M36.5 9 Q37 12 40 12.5 Q37 13 36.5 16 Q36 13 33 12.5 Q36 12 36.5 9 Z" fill="#F97316" stroke="none"/>
    <!-- 铅笔复描：左边缘旁短平行线，铅笔手感 -->
    <path d="M10.6 24 Q10.4 26.2 10.5 28.5" stroke="#3B82F6"/>
  </g>
</svg>
