<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
  <!-- 底稿：实线竖版页面（左上） -->
  <rect x="8" y="7" width="22" height="30" rx="3"/>
  <!-- 覆盖稿：虚线描边表示透明覆盖层（右下错位叠放，露出底稿一角） -->
  <rect x="18" y="11" width="22" height="30" rx="3" stroke-dasharray="3 5"/>
  <!-- 两层重合处的对齐十字（套准标记） -->
  <path d="M20.5 24 H27.5 M24 20.5 V27.5"/>
</svg>
