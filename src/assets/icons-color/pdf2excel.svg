<!-- pdf2excel：蓝色 PDF 页经橙色箭头导出为右侧青色表格网格片（石板灰行列线划出 3×3 单元格）——PDF 转 Excel 表格 -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <g transform="rotate(-2 24 24)" stroke-width="2.5">
    <!-- 蓝色 PDF 页 -->
    <path stroke="#3B82F6" d="M9.6 16.3 Q12.6 16 15.6 16.3 Q18.3 16.5 18.4 19.1 Q18.6 24 18.4 28.9 Q18.3 31.5 15.5 31.7 Q12.5 32 9.5 31.7 Q6.8 31.5 6.7 28.9 Q6.5 24 6.7 19.1 Q6.8 16.5 9.6 16.3 Z"/>
    <!-- 橙色导出箭头 -->
    <path stroke="#F97316" d="M21.2 24 Q23.2 23.7 25.2 23.9 M23.2 21.6 L25.2 23.9 L23.2 26.2"/>
    <!-- 青色表格网格片 -->
    <path stroke="#14B8A6" d="M31.4 15.8 Q35 15.4 38.6 15.8 Q41.4 16.1 41.4 18.2 Q41.7 24 41.4 29.8 Q41.4 31.9 38.6 32.2 Q35 32.6 31.4 32.2 Q28.6 31.9 28.6 29.8 Q28.3 24 28.6 17.9 Q28.6 16.1 31.4 15.8 Z"/>
    <!-- 行列网格线 -->
    <path stroke="#64748B" d="M28.8 21.2 Q35 20.9 41.2 21.2 M28.8 26.8 Q35 26.5 41.2 26.8 M32.8 16 Q32.7 24 32.8 32 M36.8 16 Q36.7 24 36.9 32"/>
    <!-- 铅笔复描：表格片左缘平行短线 -->
    <path stroke="#14B8A6" d="M29.1 22.4 Q29 24.8 29.2 27.2"/>
  </g>
</svg>
